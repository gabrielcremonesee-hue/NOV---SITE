<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 110">
  <defs>
    <linearGradient id="carafeBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="16%" stop-color="#eef5f8" stop-opacity="0.25"/>
      <stop offset="48%" stop-color="#c9dde4" stop-opacity="0.14"/>
      <stop offset="78%" stop-color="#f7fbfd" stop-opacity="0.46"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.58"/>
    </linearGradient>
    <linearGradient id="carafeWater" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.48"/>
      <stop offset="28%" stop-color="#dfeff5" stop-opacity="0.32"/>
      <stop offset="68%" stop-color="#9ec1ce" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f2f9fc" stop-opacity="0.52"/>
    </linearGradient>
    <radialGradient id="carafeShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#090301" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#090301" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="56" cy="99" rx="34" ry="7.5" fill="url(#carafeShadow)"/>
  <!-- Thick glass handle on right -->
  <path d="M78 30 C100 30, 102 74, 83 78" fill="none" stroke="#ffffff" stroke-opacity="0.56" stroke-width="7.5" stroke-linecap="round"/>
  <path d="M78 30 C100 30, 102 74, 83 78" fill="none" stroke="#2c160a" stroke-opacity="0.22" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M81 31 C98 32, 99 69, 84 74" fill="none" stroke="#ffffff" stroke-opacity="0.82" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Back lip -->
  <ellipse cx="55" cy="14" rx="22" ry="4.5" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.6"/>
  <!-- Glass body (flared rim -> pinched neck -> wide bulbous lower carafe) -->
  <path d="M30 14 C33 19, 36 26, 36 33 C36 39, 27 49, 27 69 C27 86, 36 95, 55 95 C75 95, 84 86, 84 69 C84 49, 75 39, 75 33 C75 26, 77 19, 79 14 Z" fill="url(#carafeBody)" stroke="#ffffff" stroke-opacity="0.65" stroke-width="1.4"/>
  <!-- Clear refracted water inside (level ~62%) -->
  <path d="M30 46 L81 46 C83 53, 83.5 62, 83.5 69 C83.5 85, 74 93, 55 93 C36 93, 27.5 85, 27.5 69 C27.5 62, 28 53, 30 46 Z" fill="url(#carafeWater)"/>
  <!-- Meniscus surface -->
  <ellipse cx="55.5" cy="46" rx="25.5" ry="4.6" fill="#ffffff" fill-opacity="0.42" stroke="#ffffff" stroke-opacity="0.82" stroke-width="1.1"/>
  <!-- Thick curved glass base -->
  <path d="M29 82 C32 91, 41 95, 55 95 C69 95, 79 91, 82 82 C75 88, 66 90, 55 90 C44 90, 35 88, 29 82 Z" fill="#ffffff" fill-opacity="0.45"/>
  <!-- Crisp glass specular streaks -->
  <path d="M39 20 C38 30, 39 36, 33 50 C31 58, 31 74, 35 84" fill="none" stroke="#ffffff" stroke-opacity="0.78" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M45 48 C43 60, 43 74, 46 84" fill="none" stroke="#ffffff" stroke-opacity="0.38" stroke-width="2" stroke-linecap="round"/>
  <path d="M72 22 C73 31, 72 38, 77 52 C79 60, 78 75, 74 84" fill="none" stroke="#ffffff" stroke-opacity="0.58" stroke-width="2" stroke-linecap="round"/>
  <!-- Front rim highlight -->
  <path d="M30 14 C38 19, 68 19, 79 14" fill="none" stroke="#ffffff" stroke-opacity="0.92" stroke-width="2.1" stroke-linecap="round"/>
</svg>
