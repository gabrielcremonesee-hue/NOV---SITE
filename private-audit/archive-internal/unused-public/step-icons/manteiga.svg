<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100">
  <defs>
    <linearGradient id="butterTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4b8"/>
      <stop offset="100%" stop-color="#f2c44d"/>
    </linearGradient>
    <linearGradient id="butterSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0be42"/>
      <stop offset="100%" stop-color="#c99018"/>
    </linearGradient>
  </defs>
  <ellipse cx="60" cy="83" rx="44" ry="8.5" fill="#0d0401" fill-opacity="0.58"/>
  <!-- Small porcelain butter dish -->
  <ellipse cx="60" cy="70" rx="43" ry="12" fill="#e6dfd7"/>
  <ellipse cx="60" cy="68" rx="41" ry="10.5" fill="#ffffff"/>
  <ellipse cx="60" cy="68" rx="34" ry="7.5" fill="#ebe4dc"/>
  <!-- Butter block -->
  <polygon points="30,45 78,34 94,45 46,56" fill="url(#butterTop)"/>
  <polygon points="30,45 46,56 46,70 30,58" fill="#dfb035"/>
  <polygon points="46,56 94,45 94,59 46,70" fill="url(#butterSide)"/>
  <!-- Sliced butter pat -->
  <polygon points="22,57 38,53 45,60 29,64" fill="#fff3b5"/>
  <polygon points="22,57 29,64 29,72 22,65" fill="#ddb037"/>
  <polygon points="29,64 45,60 45,68 29,72" fill="#e6b63d"/>
